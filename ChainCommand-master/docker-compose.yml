# Hybrid Inventory Management System - PostgreSQL + MLflow + API + scheduled retraining
#
#   docker compose up --build
#
#   API docs     http://localhost:8000/docs      (login: admin@example.com / the CC_DEMO_PASSWORD below)
#   MLflow UI    http://localhost:5000
#
# The defaults below are for a local demo only. Put real values in a .env file next to this one
# (see .env.docker.example) before running anywhere else.

x-app: &app
  build: .
  image: chaincommand:latest
  environment: &app-env
    CC_ENV: ${CC_ENV:-development}
    CC_DATABASE_URL: postgresql+psycopg://chaincommand:${POSTGRES_PASSWORD:-chaincommand}@postgres:5432/chaincommand
    CC_MLFLOW_TRACKING_URI: http://mlflow:5000
    CC_JWT_SECRET: ${CC_JWT_SECRET:-demo-only-jwt-secret-change-me-0123456789abcdef}
    CC_API_KEY: ${CC_API_KEY:-demo-only-api-key}
    CC_DEMO_PASSWORD: ${CC_DEMO_PASSWORD:-Demo12345}
    CC_RL_TOTAL_TIMESTEPS: ${CC_RL_TOTAL_TIMESTEPS:-5000}   # the original simulator trains PPO at start-up
    CC_CORS_ORIGINS: ${CC_CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://localhost:8000"]}
    MLFLOW_DISABLE_TELEMETRY: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chaincommand
      POSTGRES_USER: chaincommand
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaincommand}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro      # creates the "mlflow" database
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaincommand -d chaincommand"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # MLflow tracking server + model registry. Runs and registered models live in PostgreSQL;
  # artifacts (model files, plots) are stored by the server and reached through its proxy,
  # so the other containers never need the artifact volume.
  mlflow:
    <<: *app
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg://chaincommand:${POSTGRES_PASSWORD:-chaincommand}@postgres:5432/mlflow
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      # MLflow 3 rejects unknown Host headers; "mlflow" is this service's name on the compose network
      - --allowed-hosts=mlflow:5000,mlflow,localhost:5000,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot: create tables, seed demo data and users, train the first champion models,
  # create the first forecasts and pending recommendations. Safe to run again.
  bootstrap:
    <<: *app
    command: ["python", "-m", "chaincommand.mlops", "bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  # Daily monitoring + drift check, weekly retraining, monthly full retraining,
  # and event-driven retraining when drift / accuracy loss / a stockout spike is detected.
  scheduler:
    <<: *app
    command: ["python", "-m", "chaincommand.mlops", "scheduler"]
    volumes:
      - scheduler-state:/app/artifacts
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  mlflow-artifacts:
  scheduler-state:
